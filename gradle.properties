org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Compile Kotlin in-process instead of via the Kotlin daemon. The daemon writes
# its marker files to ~/.local/share/kotlin/daemon, which is read-only in this
# build sandbox; forcing in-process compilation makes the build reproducible
# here and avoids the "Read-only file system" failure (the daemon's only
# fallback is to do exactly this, unreliably).
